name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner: darwin binaries build natively (FSEvents needs Apple's
    # CoreServices framework, which zig can't provide), and zigbuild still
    # cross-compiles the Linux/Windows targets from here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Zig is the cross-linker cargo-zigbuild drives; cargo-zigbuild itself is
      # installed by GoReleaser's before-hook.
      - uses: mlugg/setup-zig@v2

      # `fury` CLI pushes the deb/rpm/apk to Gemfury (repo.aymanbagabas.com).
      # https://gemfury.com/guide/cli/install/
      - name: Install Gemfury CLI
        run: |
          brew tap gemfury/tap
          brew trust gemfury/tap
          brew install fury-cli
          fury version

      # AUR regularly goes down for maintenance. Probe the SSH endpoint first;
      # if it's unreachable, tell GoReleaser to skip the aur publisher so the
      # rest of the release still ships. ssh exit 255 == transport/auth failure
      # (AUR down or key missing); any other code means we reached the AUR shell.
      - name: Check AUR availability
        id: aur
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          key="$(mktemp)"
          printf '%s\n' "$AUR_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 -o BatchMode=yes \
              aur@aur.archlinux.org help >/dev/null 2>&1
          rc=$?
          rm -f "$key"
          if [ "$rc" -eq 255 ]; then
            echo "::warning title=AUR skipped::AUR unreachable (ssh rc=255) — skipping the aur publisher; publish it manually once AUR is back."
            echo "skip=--skip=aur" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.aur.outputs.skip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to homebrew-tap and scoop-bucket.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      # Keep the built archives/packages around for a week for debugging.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 7

      # Publish the crate last, once the release itself succeeded. Reuses the
      # toolchain already set up above.
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    # OIDC trusted publishing: no NPM_TOKEN; npm authenticates via the OIDC
    # id-token GitHub mints for this job.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships an older one.
      - run: npm install -g npm@latest

      # Reuse the project README as the package README (npm rewrites relative
      # links to the repo's default branch) instead of maintaining a duplicate.
      - run: cp README.md npm/README.md

      # Match the package version to the release tag, then publish. The wrapper
      # downloads the matching release binary at install time. Auth is via OIDC,
      # so no token is needed and provenance is attached automatically.
      - name: Publish to npm
        working-directory: npm
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
