[package]
name = "diffv"
version = "0.1.0"
edition = "2021"
description = "A standalone git diff pager for the terminal, built on uncurses."
license = "MIT"

[[bin]]
name = "diffv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
uncurses = { git = "https://github.com/aymanbagabas/uncurses" }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
notify = "8"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
