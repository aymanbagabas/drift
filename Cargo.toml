[package]
name = "drift-diff"
version = "0.0.8"
edition = "2021"
description = "A standalone git diff pager for the terminal, built on uncurses."
license = "MIT"
repository = "https://github.com/aymanbagabas/drift"
readme = "README.md"
keywords = ["git", "diff", "pager", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["demo/"]

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
uncurses = "0.0.3"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
notify = "8"
similar = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
regex = "1.13.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo binstall` reuses the GoReleaser release archives. Their names mirror
# the GoReleaser `archives.name_template` (drift_<version>_<os>_<arch>.<ext>),
# which uses Go-style os/arch rather than Rust target triples, so each target is
# mapped explicitly. Targets with no entry (musl, 32-bit, ...) have no published
# binary and fall back to building from source.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/drift_{ version }_darwin_amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/drift_{ version }_darwin_arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/drift_{ version }_linux_amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/drift_{ version }_linux_arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/drift_{ version }_windows_amd64.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/drift_{ version }_windows_amd64.zip"
pkg-fmt = "zip"
