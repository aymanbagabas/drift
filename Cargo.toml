[package]
name = "drift-diff"
version = "0.0.4"
edition = "2021"
description = "A standalone git diff pager for the terminal, built on uncurses."
license = "MIT"
repository = "https://github.com/aymanbagabas/drift"
readme = "README.md"
keywords = ["git", "diff", "pager", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["demo/"]

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
uncurses = "0.0.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
notify = "8"
similar = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
regex = "1.13.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
